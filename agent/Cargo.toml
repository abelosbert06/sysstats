[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sys_stats"
path = "src/main.rs"

[dependencies]
shared-types = { path = "../shared-types" }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "5.0"
rpassword = "7.3"
