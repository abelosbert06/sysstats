[package]
name = "frontend-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frontend-app"
path = "src/main.rs"

[dependencies]
shared-types = { path = "../shared-types" }
dioxus = { version = "0.7", features = ["web"] }
dioxus-charts = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
